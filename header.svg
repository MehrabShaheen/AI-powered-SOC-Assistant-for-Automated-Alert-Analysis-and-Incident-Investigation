<svg width="1000" height="470" viewBox="0 0 1000 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgC1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1416"/><stop offset="55%" stop-color="#111A1D"/><stop offset="100%" stop-color="#141F22"/>
    </linearGradient>
    <radialGradient id="nodeGlowC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E3A768"/><stop offset="100%" stop-color="#C97D3D"/>
    </radialGradient>
    <filter id="glowC" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridC" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0 L0 0 0 38" fill="none" stroke="#1B2427" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1000" height="470" fill="url(#bgC1)"/>
  <rect width="1000" height="470" fill="url(#gridC)" opacity="0.35"/>

  <text x="500" y="42" text-anchor="middle" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#EDEAE2">AI-Powered SOC Assistant</text>
  <text x="500" y="64" text-anchor="middle" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13" fill="#8FA0A0">Automated Alert Analysis and Intelligent Incident Investigation</text>

  <line x1="60" y1="82" x2="940" y2="82" stroke="#C97D3D" stroke-width="1" opacity="0.35"/>
  <text x="500" y="105" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4FA6A0" opacity="0.9">AI REASONING</text>

  <!-- AI Reasoning cluster (left) -->
  <g id="brainC" transform="translate(180,175)">
    <g stroke="#C97D3D" stroke-width="1" opacity="0.55">
      <line x1="0" y1="0" x2="-30" y2="-26"/><line x1="0" y1="0" x2="26" y2="-30"/>
      <line x1="0" y1="0" x2="-34" y2="17"/><line x1="0" y1="0" x2="32" y2="15"/>
      <line x1="0" y1="0" x2="0" y2="38"/><line x1="-30" y1="-26" x2="26" y2="-30"/>
      <line x1="-34" y1="17" x2="0" y2="38"/><line x1="32" y1="15" x2="0" y2="38"/>
      <line x1="-30" y1="-26" x2="-34" y2="17"/><line x1="26" y1="-30" x2="32" y2="15"/>
    </g>
    <g fill="url(#nodeGlowC)" filter="url(#glowC)">
      <circle cx="0" cy="0" r="9"/><circle cx="-30" cy="-26" r="5.5"/><circle cx="26" cy="-30" r="5.5"/>
      <circle cx="-34" cy="17" r="5.5"/><circle cx="32" cy="15" r="5.5"/><circle cx="0" cy="38" r="5.5"/>
    </g>
    <circle cx="0" cy="0" r="9" fill="none" stroke="#E3A768" stroke-width="2" opacity="0.8">
      <animate attributeName="r" values="9;24;9" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="70" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#EDEAE2">Reasoning Engine</text>
  </g>

  <g transform="translate(80,140)" opacity="0.9">
    <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#141F22" stroke="#C97D3D" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" fill="#C1443C" font-weight="700">!</text>
  </g>
  <g transform="translate(80,215)" opacity="0.9">
    <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#141F22" stroke="#C97D3D" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-size="11" fill="#C1443C" font-weight="700">!</text>
  </g>
  <line x1="89" y1="140" x2="148" y2="163" stroke="#C97D3D" stroke-width="1" opacity="0.35"/>
  <line x1="89" y1="215" x2="148" y2="190" stroke="#C97D3D" stroke-width="1" opacity="0.35"/>

  <path id="flowPathC" d="M225,175 C340,125 440,225 560,175" fill="none" stroke="#C97D3D" stroke-width="1.4" opacity="0.4" stroke-dasharray="4,5"/>
  <circle r="3.6" fill="#E3A768" filter="url(#glowC)"><animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#flowPathC"/></animateMotion></circle>
  <circle r="3.6" fill="#E3A768" filter="url(#glowC)"><animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite"><mpath href="#flowPathC"/></animateMotion></circle>
  <circle r="3.6" fill="#E3A768" filter="url(#glowC)"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#flowPathC"/></animateMotion></circle>

  <g transform="translate(600,175)">
    <path d="M0,-38 L30,-24 L30,8 C30,34 0,46 0,46 C0,46 -30,34 -30,8 L-30,-24 Z" fill="#141F22" stroke="#E3A768" stroke-width="2" filter="url(#glowC)"/>
    <path d="M-13,2 L-3,12 L16,-11" fill="none" stroke="#E3A768" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="70" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="11.5" fill="#EDEAE2">SOC Verdict</text>
  </g>

  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#EDEAE2">
    <rect x="670" y="130" width="130" height="22" rx="11" fill="#141F22" stroke="#C1443C" stroke-width="1"/><text x="735" y="145" text-anchor="middle">TRUE POSITIVE</text>
    <rect x="670" y="165" width="130" height="22" rx="11" fill="#141F22" stroke="#4FA6A0" stroke-width="1"/><text x="735" y="180" text-anchor="middle">FALSE POSITIVE</text>
    <rect x="670" y="200" width="130" height="22" rx="11" fill="#141F22" stroke="#E3A768" stroke-width="1"/><text x="735" y="215" text-anchor="middle">AMBIGUOUS</text>
  </g>

  <line x1="60" y1="255" x2="940" y2="255" stroke="#C97D3D" stroke-width="1" opacity="0.35"/>
  <text x="500" y="278" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4FA6A0" opacity="0.9">LIVE INVESTIGATION CONSOLE</text>

  <g transform="translate(30,295)">
    <rect width="300" height="150" rx="6" fill="#141F22" stroke="#233033" stroke-width="1" opacity="0.95"/>
    <text x="14" y="22" font-family="IBM Plex Mono, monospace" font-size="11" fill="#E3A768">ALERT VOLUME (24H)</text>
    <polyline points="14,125 45,108 76,116 107,80 138,92 169,60 200,72 231,48 262,55" fill="none" stroke="#C97D3D" stroke-width="2.2" filter="url(#glowC)" stroke-dasharray="350" stroke-dashoffset="350">
      <animate attributeName="stroke-dashoffset" values="350;0" dur="2s" fill="freeze"/>
    </polyline>
    <circle cx="262" cy="55" r="3.5" fill="#E3A768" filter="url(#glowC)"><animate attributeName="r" values="3.5;6;3.5" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(350,295)">
    <rect width="290" height="150" rx="6" fill="#141F22" stroke="#233033" stroke-width="1" opacity="0.95"/>
    <text x="14" y="22" font-family="IBM Plex Mono, monospace" font-size="11" fill="#E3A768">VERDICT BREAKDOWN</text>
    <text x="14" y="48" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#8FA0A0">TRUE POSITIVE</text>
    <rect x="14" y="53" width="0" height="7" rx="3.5" fill="#C1443C"><animate attributeName="width" values="0;90" dur="1.4s" fill="freeze"/></rect>
    <text x="14" y="80" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#8FA0A0">FALSE POSITIVE</text>
    <rect x="14" y="85" width="0" height="7" rx="3.5" fill="#4FA6A0"><animate attributeName="width" values="0;170" dur="1.4s" begin="0.2s" fill="freeze"/></rect>
    <text x="14" y="112" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="#8FA0A0">AMBIGUOUS</text>
    <rect x="14" y="117" width="0" height="7" rx="3.5" fill="#E3A768"><animate attributeName="width" values="0;60" dur="1.4s" begin="0.4s" fill="freeze"/></rect>
  </g>

  <g transform="translate(660,295)">
    <rect width="310" height="150" rx="6" fill="#141F22" stroke="#233033" stroke-width="1" opacity="0.95"/>
    <text x="14" y="22" font-family="IBM Plex Mono, monospace" font-size="11" fill="#E3A768">SOURCE HOSTS</text>
    <g stroke="#C97D3D" stroke-width="1" opacity="0.5">
      <line x1="55" y1="90" x2="155" y2="70"/><line x1="155" y1="70" x2="255" y2="95"/>
      <line x1="155" y1="70" x2="155" y2="130"/><line x1="55" y1="90" x2="155" y2="130"/>
    </g>
    <circle cx="155" cy="70" r="7" fill="#C97D3D" filter="url(#glowC)"/>
    <circle cx="55" cy="90" r="4.5" fill="#E3A768"><animate attributeName="r" values="4.5;8;4.5" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="255" cy="95" r="4.5" fill="#C1443C"><animate attributeName="r" values="4.5;8;4.5" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="155" cy="130" r="4.5" fill="#4FA6A0"><animate attributeName="r" values="4.5;8;4.5" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <text x="500" y="460" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4FA6A0">
    status: <tspan fill="#E3A768">monitoring</tspan><tspan fill="#E3A768">_</tspan>
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </text>
</svg>
