<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#123B6B"/>
    </linearGradient>
    <filter id="gD" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="200" rx="10" fill="url(#bgD)"/>
  <text x="30" y="30" font-family="Consolas, monospace" font-size="13" fill="#7EDCFF">FUTURE ROADMAP</text>

  <line x1="60" y1="110" x2="940" y2="110" stroke="#2E9EFF" stroke-width="1.5" opacity="0.5"/>

  <g font-family="Segoe UI, sans-serif" fill="#EAF6FF">
    <circle cx="140" cy="110" r="7" fill="#4FC3F7" filter="url(#gD)"/>
    <text x="140" y="90" text-anchor="middle" font-size="11" fill="#7EDCFF">[Milestone 1]</text>
    <text x="140" y="135" text-anchor="middle" font-size="10" fill="#BEE7FF">[Short description]</text>

    <circle cx="370" cy="110" r="7" fill="#4FC3F7" filter="url(#gD)"/>
    <text x="370" y="90" text-anchor="middle" font-size="11" fill="#7EDCFF">[Milestone 2]</text>
    <text x="370" y="135" text-anchor="middle" font-size="10" fill="#BEE7FF">[Short description]</text>

    <circle cx="600" cy="110" r="7" fill="#4FC3F7" filter="url(#gD)"/>
    <text x="600" y="90" text-anchor="middle" font-size="11" fill="#7EDCFF">[Milestone 3]</text>
    <text x="600" y="135" text-anchor="middle" font-size="10" fill="#BEE7FF">[Short description]</text>

    <circle cx="830" cy="110" r="8" fill="#123B8C" stroke="#7EDCFF" stroke-width="1.5" filter="url(#gD)"/>
    <text x="830" y="90" text-anchor="middle" font-size="11" fill="#7EDCFF">[Long-term Vision]</text>
    <text x="830" y="135" text-anchor="middle" font-size="10" fill="#BEE7FF">[Short description]</text>
  </g>
  <text x="500" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#3A6E82">edit milestones directly in this SVG — do not present unverified plans as completed work</text>
</svg>
