<svg width="1000" height="320" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0D1416"/><stop offset="100%" stop-color="#141F22"/></linearGradient>
    <filter id="g3" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C97D3D"/></marker>
  </defs>
  <rect width="1000" height="320" rx="10" fill="url(#bg3)"/>
  <text x="30" y="34" font-family="IBM Plex Mono, monospace" font-size="13" fill="#4FA6A0">MODERN SOC — FROM NOISE TO SIGNAL</text>

  <g transform="translate(110,175)">
